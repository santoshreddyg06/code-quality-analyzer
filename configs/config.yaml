# Project-level configuration for the AI Code Quality Analyzer
# Sensitive values (tokens, keys) must go in .env, NOT here.

github:
  request_timeout: 30

data_collection:
  # Start with 3 repos and 150 commits each = ~450 commits total
  # Each commit costs ~1-2 API calls. 450 commits ~ 900 calls out of 5000 budget.
  target_repos:
    - "pallets/flask"
    - "psf/requests"
    - "django/django"
  max_commits_per_repo: 150
  min_changed_files: 1
  max_changed_files: 20
  labeling_window_days: 90

metrics:
  complexity_thresholds:
    low: 5
    medium: 10
    high: 20

models:
  test_size: 0.15
  val_size: 0.15
  random_state: 42

api:
  host: "0.0.0.0"
  port: 8000
  reload: true

dashboard:
  api_base_url: "http://localhost:8000"